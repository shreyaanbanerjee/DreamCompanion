# Default configuration for constraint-driven-dev
enabled: true
strict_tdd: true
require_plan_signoff: true
max_diff_lines_per_step: 150
auto_rollback_on_test_failure: true
verification_command: "auto"
supported_frameworks:
  python: "pytest -v"
  node: "npm test"
  rust: "cargo test"
  go: "go test ./..."
